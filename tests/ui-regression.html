<!doctype html><meta charset="utf-8"><title>Meadowline UI regression</title>
<iframe id="game" src="../index.html" style="width:1280px;height:720px;border:0"></iframe><pre id="results">Running…</pre>
<script>
game.addEventListener('load',()=>setTimeout(async()=>{
  const w=game.contentWindow,d=game.contentDocument; d.getElementById('b-start').click();
  let postcard=''; const original=w.HTMLAnchorElement.prototype.click;
  w.HTMLAnchorElement.prototype.click=function(){postcard=this.href};
  // Sound now starts on, so the button's absolute state is not the thing to
  // assert - the toggle is. Read where it starts, then check each input moves
  // it the other way.
  const sound=d.getElementById('b-sound'), mutedAtBoot=sound.classList.contains('off');
  sound.click(); const soundToggled=sound.classList.contains('off')!==mutedAtBoot;
  const mini=d.getElementById('mini'),map=d.getElementById('b-map'); const mapBefore=!mini.classList.contains('hide'); map.click(); const mapAfter=!mini.classList.contains('hide');
  d.getElementById('b-shot').click();
  // toBlob is async and slow under software rendering, so wait for the
  // anchor rather than a fixed delay
  for(let i=0;i<60&&!postcard;i++) await new Promise(r=>setTimeout(r,50));
  w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'s',bubbles:true})); const speed=d.getElementById('b-speed').textContent;
  w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'m',bubbles:true}));
  w.HTMLAnchorElement.prototype.click=original;
  const checks={soundToggled,soundRestored:sound.classList.contains('off')===mutedAtBoot,minimap:mapBefore!==mapAfter,postcard:postcard.startsWith('blob:')||postcard.startsWith('data:image/png'),keyboardSpeed:speed==='2×',canvas:d.getElementById('c').width>0};
  const pass=Object.values(checks).every(Boolean); results.textContent=JSON.stringify({pass,checks},null,2); document.documentElement.dataset.result=pass?'pass':'fail';
},500));
</script>
