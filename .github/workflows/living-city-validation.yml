name: Living City Validation
on:
  push:
    branches:
      - feature/living-city-foundation
      - feature/housing-2
      - feature/city-growth-progression
      - feature/city-hall-civic-center
      - feature/roads-mobility-2
      - feature/recreation-2-town-life
      - feature/living-city-3-aaa-municipal
      - feature/living-city-3-1-aaa-visual
      - feature/ui-hud-2-premium-interface
  pull_request:
    branches:
      - feature/living-city-foundation
      - agent/architecture-refactor
      - feature/living-city-3-1-aaa-visual
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        # Parsed as ES modules, which is what the browser loads. Plain
        # `node --check` treats a .js file as CommonJS and accepts things the
        # browser rejects, such as `await` inside a non-async function.
        run: |
          for f in $(find src tests -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "module parse failed: $f"; exit 1; }
          done
          find src tests -name '*.mjs' | xargs -n1 node --check
      - name: Module hygiene
        run: node tests/module-hygiene.mjs
      - name: Browser regression
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/meadowline-http.log 2>&1 &
          sleep 1
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/tests/regression.html >/tmp/meadowline-regression.html
          cat /tmp/meadowline-regression.html
          grep -q 'data-result="pass"' /tmp/meadowline-regression.html
      - name: City Growth regression
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/tests/city-growth-regression.html >/tmp/meadowline-city-growth.html
          cat /tmp/meadowline-city-growth.html
          grep -q 'data-result="pass"' /tmp/meadowline-city-growth.html
      - name: City Growth 1.1 goals and touch regression
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/tests/city-growth-1-1-regression.html >/tmp/meadowline-city-growth-1-1.html
          cat /tmp/meadowline-city-growth-1-1.html
          grep -q 'data-result="pass"' /tmp/meadowline-city-growth-1-1.html
      - name: City Hall 1.0 regression
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/tests/city-hall-regression.html >/tmp/meadowline-city-hall.html
          cat /tmp/meadowline-city-hall.html
          grep -q 'data-result="pass"' /tmp/meadowline-city-hall.html
      - name: Roads and Mobility 2.0 regression
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/tests/roads-mobility-regression.html >/tmp/meadowline-roads-mobility.html
          cat /tmp/meadowline-roads-mobility.html
          grep -q 'data-result="pass"' /tmp/meadowline-roads-mobility.html
      - name: Recreation 2.0 and Town Life regression
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8000/tests/recreation-regression.html >/tmp/meadowline-recreation.html
          cat /tmp/meadowline-recreation.html
          grep -q 'data-result="pass"' /tmp/meadowline-recreation.html
      - name: Living City 3 municipal regression
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8000/tests/living-city-3-regression.html >/tmp/meadowline-living-city-3.html
          cat /tmp/meadowline-living-city-3.html
          grep -q 'data-result="pass"' /tmp/meadowline-living-city-3.html
      - name: Living City 3.1 renderer and incident regression
        run: |
          google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8000/tests/living-city-3-1-regression.html >/tmp/meadowline-living-city-3-1.html
          cat /tmp/meadowline-living-city-3-1.html
          grep -q 'data-result="pass"' /tmp/meadowline-living-city-3-1.html
      - name: Controlled renderer benchmark
        run: |
          google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/tests/renderer-benchmark.html >/tmp/meadowline-renderer-benchmark.html
          cat /tmp/meadowline-renderer-benchmark.html
          grep -q 'data-result="pass"' /tmp/meadowline-renderer-benchmark.html
      - name: Visual Cohesion 3.1.1 regression
        run: |
          google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/tests/visual-cohesion-regression.html >/tmp/meadowline-visual-cohesion.html
          cat /tmp/meadowline-visual-cohesion.html
          grep -q 'data-result="pass"' /tmp/meadowline-visual-cohesion.html
      - name: UI and HUD 2.0 regression
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8000/tests/ui-hud-2-regression.html >/tmp/meadowline-ui-hud-2.html
          cat /tmp/meadowline-ui-hud-2.html
          grep -q 'data-result="pass"' /tmp/meadowline-ui-hud-2.html
      - name: Game boot smoke test
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8000/?debug=1 >/tmp/meadowline-game.html
          grep -q 'data-boot="pass"' /tmp/meadowline-game.html
          grep -q 'graphics-settings' /tmp/meadowline-game.html
      - name: Capture deterministic Three.js scene
        run: google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl --window-size=1280,720 --virtual-time-budget=8000 --screenshot=/tmp/meadowline-three.png http://127.0.0.1:8000/tests/three-visual.html
      - name: Capture phone and iPad cohesion scenes
        run: |
          google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl --window-size=390,844 --virtual-time-budget=8000 --screenshot=/tmp/meadowline-phone.png http://127.0.0.1:8000/tests/three-visual.html
          google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl --window-size=1366,1024 --virtual-time-budget=8000 --screenshot=/tmp/meadowline-ipad.png http://127.0.0.1:8000/tests/three-visual.html
      - uses: actions/upload-artifact@v4
        with:
          name: meadowline-three-preview
          path: |
            /tmp/meadowline-three.png
            /tmp/meadowline-phone.png
            /tmp/meadowline-ipad.png
