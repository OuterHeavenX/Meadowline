name: Assemble Meadowline baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble original index.html
        run: cat .baseline_parts/part00 .baseline_parts/part01 .baseline_parts/part02 .baseline_parts/part03 .baseline_parts/part04 .baseline_parts/part05 .baseline_parts/part06 .baseline_parts/part07 > index.html
      - name: Commit assembled baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add original Meadowline game baseline" || exit 0
          git push
